name: Denticon
kind: company
description: Denticon is a cloud-based dental practice management platform built for
  dental service organizations (DSOs) and multi-location group practices, owned and
  operated by Planet DDS (which also owns Cloud 9 Ortho and Apteryx imaging). The
  Denticon API program - relaunched in July 2024 on a new developer portal powered
  by Azure API Management - exposes RESTful APIs, webhooks, and batch data extracts
  covering patient, appointment, financial/ledger, insurance and claims (Revenue
  Cycle Management), clinical, and practice/office data, with OAuth 2.0 auth, an
  event-driven architecture for synchronized updates, and writebacks into Denticon.
  API access is partner-gated - Planet DDS must approve vendors and each client
  practice authorizes vendor access to specific office locations (OIDs). Public
  documentation exists, but keys and interactive access require program enrollment,
  so the endpoint surface below is modeled from the published API categories rather
  than a downloadable OpenAPI specification.
